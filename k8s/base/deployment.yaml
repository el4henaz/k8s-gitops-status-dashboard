apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-dashboard
  namespace: status-dashboard
  labels:
    app: status-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: status-dashboard
  template:
    metadata:
      labels:
        app: status-dashboard
    spec:
      containers:
        - name: web
          image: status-dashboard:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /usr/share/nginx/html/services.json
              subPath: services.json
      volumes:
        - name: config
          configMap:
            name: status-dashboard-config
